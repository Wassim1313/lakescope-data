<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>LakeScope 3-D</title>
<meta name="description" content="3-D lake view: terrain, lake bed depth and today's fishing spots.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14212b;--muted:#5d6b76;--card:rgba(255,255,255,.86);--line:rgba(20,33,43,.08);--accent:#0f6fa8;--pin:#f2a516;--bg1:#e8eef2;--bg2:#c9d6de;--shadow:0 6px 24px rgba(16,32,46,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#e8eef2;--muted:#9fb0bc;--card:rgba(18,28,36,.82);--line:rgba(255,255,255,.08);--accent:#5cb6ea;--bg1:#1a2630;--bg2:#0e161c;--shadow:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--ink:#e8eef2;--muted:#9fb0bc;--card:rgba(18,28,36,.82);--line:rgba(255,255,255,.08);--accent:#5cb6ea;--bg1:#1a2630;--bg2:#0e161c;--shadow:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,var(--bg1),var(--bg2));font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.card{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;max-width:440px;margin:0 auto;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:18px;padding:14px 16px 12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.card h1{font-size:20px;font-weight:700;letter-spacing:-.01em}
.card h1 small{font-size:13px;font-weight:500;color:var(--muted);margin-left:6px}
.brand{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.stats{display:grid;grid-template-columns:1fr 1.35fr .75fr;gap:8px;margin-top:10px}
.stat{border-radius:12px;background:rgba(127,150,165,.12);padding:8px 10px;min-width:0}
.stat b{display:block;font-size:16px;font-weight:700;white-space:nowrap}
.stat span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.stat b .arrow{display:inline;color:var(--accent);font-size:16px;margin:0}
.legend{position:fixed;left:12px;bottom:max(14px,env(safe-area-inset-bottom));background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:12px;padding:8px 10px 7px;box-shadow:var(--shadow);border:1px solid var(--line);font-size:11px;color:var(--muted)}
.legend .bar{width:150px;height:8px;border-radius:4px;margin:5px 0 3px;background:linear-gradient(90deg,#c4ecef,#86cde0 12%,#4a9fcb 30%,#2569a6 55%,#153f7a 80%,#0b2550)}
.legend .ticks{display:flex;justify-content:space-between;width:150px;font-variant-numeric:tabular-nums}
.legend .ttl{font-weight:600;color:var(--ink)}
.btns{position:fixed;right:12px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px}
.btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--shadow);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.btn svg{width:20px;height:20px}
.card,.legend,.btns{z-index:6}
.pin{z-index:3;position:fixed;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--pin);color:#1d1400;font:700 14px/30px Inter,sans-serif;text-align:center;border:2px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);cursor:pointer;will-change:transform;transition:opacity .2s}
.pin.on{background:#fff;color:#000;border-color:var(--pin);transform-origin:center}
.pin::after{content:"";position:absolute;inset:-9px;border-radius:50%}
.sheet{position:fixed;left:12px;right:12px;bottom:max(14px,env(safe-area-inset-bottom));max-width:460px;margin:0 auto;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);border:1px solid var(--line);transform:translateY(140%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;gap:12px;align-items:flex-start;z-index:5}
.sheet.show{transform:none}
@media (max-width:899px){body.sheet-open .btns,body.sheet-open .legend{opacity:0;pointer-events:none}}
.sheet{z-index:7!important}
.btns{transition:opacity .2s}
.sheet .num{flex:none;width:30px;height:30px;border-radius:50%;background:var(--pin);color:#1d1400;font-weight:700;display:grid;place-items:center}
.sheet h2{font-size:15px;font-weight:700}
.sheet p{font-size:13.5px;line-height:1.4;color:var(--muted);margin-top:2px}
.sheet .dep{font-size:12px;font-weight:600;color:var(--accent);margin-top:5px}
.sheet .x{margin-left:auto;flex:none;background:none;border:0;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;padding:0 2px}
.hint{position:fixed;left:50%;transform:translateX(-50%);bottom:max(96px,calc(env(safe-area-inset-bottom) + 82px));font-size:12px;color:var(--muted);background:var(--card);padding:5px 10px;border-radius:999px;box-shadow:var(--shadow);transition:opacity .6s;pointer-events:none;white-space:nowrap}
.loading{position:fixed;inset:0;display:grid;place-items:center;font-size:14px;color:var(--muted)}

.chips{display:flex;gap:6px;overflow-x:auto;margin:10px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:rgba(127,150,165,.12);color:var(--ink);font:600 12.5px Inter,sans-serif;padding:7px 11px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.plan{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.plan[hidden]{display:none}
.plan button{border:0;background:var(--pin);color:#1d1400;font:700 12.5px Inter,sans-serif;padding:6px 12px;border-radius:999px;cursor:pointer}
.pro{display:inline-block;font:800 10.5px Inter,sans-serif;letter-spacing:.06em;background:linear-gradient(135deg,#f6c64a,#e79a12);color:#2a1a00;padding:3px 7px;border-radius:6px;margin-left:8px;vertical-align:3px}
.pin.locked{background:#d5dbe0;color:#55626c;border-color:#fff}
.pin.locked svg{width:14px;height:14px;margin-top:6px}
.pin.dim{opacity:0!important;pointer-events:none!important}
.sheet{display:block;max-height:68vh;overflow:auto;padding:14px 16px 16px}
.sh-head{display:flex;gap:12px;align-items:center}
.sh-head h2{font-size:16px}
.conf{margin-left:auto;font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap}
.conf.good{background:rgba(46,160,90,.16);color:#1f7a45}.conf.fair{background:rgba(214,150,30,.18);color:#94620a}
.sh-why{font-size:13.5px;line-height:1.4;color:var(--muted);margin:8px 0 10px}
.fish{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fish span{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:rgba(15,111,168,.1);color:var(--accent)}
.fish span.main{background:var(--accent);color:#fff}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fact{background:rgba(127,150,165,.11);border-radius:12px;padding:8px 10px}
.fact.wide{grid-column:1/-1}
.fact i{display:block;font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fact b{display:block;font-size:14px;font-weight:600;margin-top:2px;line-height:1.35}
.fact small{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.blurred{filter:blur(6px);user-select:none;pointer-events:none}
.lockwrap{position:relative}
.upsell{position:absolute;inset:-14px -16px -16px;padding:18px 16px!important;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.8));display:flex;flex-direction:column;justify-content:center;gap:8px;padding:6px 2px}
.upsell h3{font-size:16px;text-align:center}.upsell p{font-size:12.5px;color:var(--muted);text-align:center;margin-bottom:4px}
.opt{display:flex;align-items:center;gap:10px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:11px 12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;box-shadow:0 2px 8px rgba(16,32,46,.08)}
.opt b{display:block;font-size:14px;white-space:nowrap}.opt span{display:block;font-size:12px;color:var(--muted)}
.opt .pr{margin-left:auto;font-weight:700;font-size:14px;white-space:nowrap}
.opt{position:relative}.opt.best{border:2px solid var(--pin)}
.opt .tag{position:absolute;top:-9px;right:14px;font-size:10px;font-weight:800;background:var(--pin);color:#1d1400;border-radius:5px;padding:2px 6px}
.opt .ic{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:rgba(127,150,165,.15)}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20}
.btn.on{background:var(--ink);color:var(--card)}
.legend .bar.temp{background:linear-gradient(90deg,#2c7bb6,#abd9e9,#ffffbf,#fdae61,#d7191c)}
@media (max-width:899px){.sheet{max-height:56vh;padding:12px 14px 14px}.sh-why{font-size:13px;margin:6px 0 8px}.fact b{font-size:13.5px}.fact small{font-size:11.5px}.facts{gap:6px}.fish{margin-bottom:8px}}
@media (max-width:899px) and (prefers-color-scheme:dark){.upsell{background:linear-gradient(180deg,rgba(18,28,36,.55),rgba(18,28,36,.85))}}
@media (min-width:900px){.card{left:20px;right:auto;top:20px;width:400px;margin:0}.legend{left:20px;bottom:20px}.btns{right:20px;bottom:20px}.sheet{left:auto;right:84px;bottom:20px;width:440px;max-height:calc(100vh - 40px)}}
</style>

</div>
<div class="hint" id="hint">Drag to turn · pinch to zoom · tap a pin</div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>
<script>window.META=null;window.CONT=null;</script>
<script type="module">
import * as THREE from 'three';

const QS = new URLSearchParams(location.search);
const LID = QS.get('lake') || 'lake_travis_tx';
const BASE = QS.get('base') || new URL('../', location.href).href;
const STAMP = QS.get('v') ? '?v=' + encodeURIComponent(QS.get('v')) : '';

// ---------- data ----------

// colour ramps
function ramp(stops, t) {

// ---------- terrain ----------
const N = nx * ny;
const pos = new Float32Array(N * 3), col = new Float32Array(N * 3);
const hm = i => H[i] / 10;    // metres relative to today's water line
const sunAz = 315 * Math.PI / 180, sunAlt = 42 * Math.PI / 180;
const Lx = Math.sin(sunAz) * Math.cos(sunAlt), Ly = Math.sin(sunAlt), Lz = -Math.cos(sunAz) * Math.cos(sunAlt);

  const i = r * nx + c, h = hm(i);

  const cl = Math.max(c - 1, 0), cr = Math.min(c + 1, nx - 1), ru = Math.max(r - 1, 0), rd = Math.min(r + 1, ny - 1);
  const gx = (hm(r * nx + cr) - hm(r * nx + cl)) * EX / ((cr - cl) * M.dxm), gz = (hm(rd * nx + c) - hm(ru * nx + c)) * EX / ((rd - ru) * M.dym);
  let nX = -gx, nY = 1, nZ = -gz; const nl = Math.hypot(nX, nY, nZ); nX /= nl; nY /= nl; nZ /= nl;

  else { rgb = ramp(LAND, h); shade = 0.42 + 0.78 * hs; }
  col[i * 3] = Math.min(1, rgb[0] * shade); col[i * 3 + 1] = Math.min(1, rgb[1] * shade); col[i * 3 + 2] = Math.min(1, rgb[2] * shade);

for (let r = 0; r < ny - 1; r++) for (let c = 0; c < nx - 1; c++) {

  idx[k++] = a; idx[k++] = d; idx[k++] = b; idx[k++] = b; idx[k++] = d; idx[k++] = e;

const terrainMat = new THREE.MeshBasicMaterial({ vertexColors: true });
for (let i = 0; i < col.length; i++) col[i] = Math.pow(col[i], 2.2);
const terrain = new THREE.Mesh(tg, terrainMat); scene.add(terrain);

// side skirts (diorama block)
let minH = 0; for (let i = 0; i < N; i++) minH = Math.min(minH, hm(i));
const baseY = (minH - 25) / 1000 * EX;
{
  const ring = [];
  for (let c = 0; c < nx; c++) ring.push([0, c]);

  const p = [], cc = [], top = hex(0x6d6354), bot = hex(0x3a342c);
  const lin = v => Math.pow(v, 2.2);
  for (const [r, c] of ring) { const i = r * nx + c; p.push(X(c), pos[i * 3 + 1], Z(r), X(c), baseY, Z(r)); cc.push(...top.map(lin), ...bot.map(lin)); }
  const ii = []; for (let j = 0; j < ring.length - 1; j++) { const a = j * 2; ii.push(a, a + 1, a + 2, a + 2, a + 1, a + 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(cc, 3)); g.setIndex(ii);
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.DoubleSide })));
  const bg = new THREE.PlaneGeometry(X(nx - 1) - X(0), Z(ny - 1) - Z(0)); bg.rotateX(Math.PI / 2); bg.translate(0, baseY, 0);

}
// soft contact shadow under the block
{
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
  const grd = g.createRadialGradient(64, 64, 10, 64, 64, 64); grd.addColorStop(0, 'rgba(10,20,30,.35)'); grd.addColorStop(1, 'rgba(10,20,30,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  const sh = new THREE.Mesh(new THREE.PlaneGeometry((X(nx - 1) - X(0)) * 1.5, (Z(ny - 1) - Z(0)) * 1.5), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cv), transparent: true, depthWrite: false }));

}

// ---------- contour lines on the bed ----------
const contourGroup = new THREE.Group(); scene.add(contourGroup);
for (const L of M.levels) {
  const segs = [];

    for (let j = 0; j + 3 < line.length; j += 2) {

    }
  }
  if (!segs.length) continue;
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(segs, 3));
  const major = L === 50 || L === 100;
  contourGroup.add(new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: major ? 0.75 : 0.42 })));
}

{
  const segs = [];
  for (const line of CONT.shore || []) for (let j = 0; j + 3 < line.length; j += 2) segs.push(X(line[j]), 0.003, Z(line[j + 1]), X(line[j + 2]), 0.003, Z(line[j + 3]));
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(segs, 3));
  const sl = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xf4fbff, transparent: true, opacity: 0.85, depthWrite: false })); sl.renderOrder = 12; scene.add(sl);
}
// ---------- water surface at today's level ----------
let water, waterMats;
{
  const p = [], ii = [], map = new Int32Array(N).fill(-1);
  const tc = [];
  const TP = [hex(0x2c7bb6), hex(0xabd9e9), hex(0xffffbf), hex(0xfdae61), hex(0xd7191c)].map(c => c.map(v => Math.pow(v, 2.2)));
  const tcol = v => { const x = Math.min(0.9999, Math.max(0, (v - 1) / 254)) * 4, k = Math.floor(x), f = x - k; return [0, 1, 2].map(q => TP[k][q] + (TP[k + 1][q] - TP[k][q]) * f); };

  const vid = i => { if (map[i] < 0) { map[i] = p.length / 3; p.push(pos[i * 3], 0, pos[i * 3 + 2]); tc.push(...tcol(near(i))); } return map[i]; };
  for (let r = 0; r < ny - 1; r++) for (let c = 0; c < nx - 1; c++) {

    if (!(wet[a] || wet[b] || wet[d] || wet[e])) continue;

  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(p, 3)); g.setAttribute('color', new THREE.Float32BufferAttribute(tc, 3)); g.setIndex(ii); g.computeVertexNormals();

  water = new THREE.Mesh(g, waterMats[0]);

  const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(Lx, Ly, Lz); scene.add(sun);
}

// ---------- fishing intelligence (simple rules) ----------
const SPECIES = [];
{ const seen = new Set(); for (const sp of M.spots) for (const [k, v] of Object.entries(sp.per || {})) if (!seen.has(k)) { seen.add(k); SPECIES.push([k, v.name]); } }
const SNAME = Object.fromEntries(SPECIES);
const FIT = {}; M.spots.forEach((sp, j) => { FIT[j] = Object.fromEntries(Object.entries(sp.per || {}).map(([k, v]) => [k, v.fit])); });
const tz = M.tz || 'America/Chicago';
const nowParts = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone: tz, month: 'numeric', hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(new Date()).map(p => [p.type, p.value]));
const month = +nowParts.month - 1, nowMin = (+nowParts.hour % 24) * 60 + +nowParts.minute;
function bestTime(sp) {
  const W = (M.windows || []).slice();
  const dawn = W.find(w => w.why.includes('sunrise')), dusk = W.find(w => w.why.includes('sunset'));
  const say = w => w === dawn ? 'Early morning, around sunrise' : 'This evening, around sunset';
  const moon = w => w.why.some(x => x.startsWith('moon')) ? ` — the moon ${w.why.includes('moonset') ? 'sets' : 'rises'} then too, which often helps` : '';
  let order = (sp === 'striped' || sp === 'white_bass' || sp === 'walleye') ? [dawn, dusk] : [W.find(w => w.best) || dusk, dawn];
  order = order.filter(Boolean);
  const open = order.filter(w => w.end_min > nowMin);
  if (!open.length) return { main: 'Tomorrow morning, around sunrise', sub: 'Today’s best bite has passed' };
  const w = open[0], other = order.find(o => o !== w && o.end_min > nowMin);
  let main = say(w) + moon(w);
  if (sp === 'catfish' && w === dusk) main = 'This evening, from sunset on into dark' + moon(w);
  if (w.start_min <= nowMin) main = 'Right now — ' + main.charAt(0).toLowerCase() + main.slice(1);
  return { main, sub: other ? `Also good: ${say(other).toLowerCase()}` : '' };
}
function rankFor(sp) {
  return M.spots.map((s, j) => ({ j, f: sp ? (FIT[j][sp] ?? 0) : (s.rank ?? Math.max(0, ...Object.values(FIT[j]))) }))
    .filter(o => sp ? o.f >= 0.45 : true).sort((a, b) => b.f - a.f || a.j - b.j);
}
const FREE_SPOT = Math.max(0, M.spots.findIndex(s => s.free));
let unlocked = QS.get('pro') === '1';
window.__unlock = () => { unlocked = true; refreshPins(); if (active >= 0) openSheet(active); };
let filter = null, order = rankFor(null);
const isLocked = j => !unlocked && j !== FREE_SPOT;

// ---------- fishing spot pins ----------
const pins = [], pinGroup = new THREE.Group(); scene.add(pinGroup);
const stemH = 0.45;
const LOCK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
M.spots.forEach((s, j) => {
  const v = new THREE.Vector3(X(s.c), 0, Z(s.r));
  const g = new THREE.BufferGeometry().setFromPoints([v, v.clone().setY(stemH)]);
  const stem = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.95 }));
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.06, 0.1, 32), new THREE.MeshBasicMaterial({ color: 0xf2a516, side: THREE.DoubleSide, transparent: true, opacity: 0.95, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; ring.position.copy(v).setY(0.002); ring.renderOrder = 11; pinGroup.add(stem, ring);
  const el = document.createElement('button'); el.className = 'pin'; el.setAttribute('aria-label', s.title);
  el.onclick = ev => { ev.stopPropagation(); openSheet(j); };
  document.body.appendChild(el);

});
function refreshPins() {

  const rank = new Map(order.map((o, k) => [o.j, k + 1]));
  pins.forEach((p, j) => {
    const r = rank.get(j), lk = isLocked(j);

}
// species chips
{
  const box = document.getElementById('chips');
  [[null, 'All fish'], ...SPECIES].forEach(([id, name]) => {

    b.onclick = () => { filter = id; box.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c === b)); refreshPins(); if (active >= 0) { if (order.some(o => o.j === active)) openSheet(active); else closeSheet(); } };
    box.appendChild(b);
  });
}
const sheet = document.getElementById('sheet');
let active = -1;
function spotHTML(j) {
  const s = M.spots[j], per = s.per || {};
  const fits = Object.entries(per).map(([k, v]) => [k, v.fit]).filter(x => x[1] >= 0.45).sort((a, b) => b[1] - a[1]);
  const sp = (filter && per[filter]) ? filter : (fits[0] || Object.entries(per)[0] || [null])[0];
  const d = sp ? per[sp] : { lo: s.depth_lo_ft, hi: s.depth_hi_ft, bait: s.bait, t_deep: s.temp_at_depth_f, fit: 0.5 };
  const zMid = Math.round((d.lo + d.hi) / 2), tTop = s.tempF ?? s.surface_f;
  const strat = tTop != null && d.t_deep != null && tTop - d.t_deep >= 3;
  const tNote = tTop == null ? '' : strat ? 'Below the warm top layer: cooler and calmer.' : 'The lake is mixed top to bottom, so fish roam many depths.';
  const bt = bestTime(sp);
  const conf = (d.fit >= 0.75 && (M.wind.mph ?? 0) <= 14) ? 'good' : 'fair';
  const rank = order.findIndex(o => o.j === j) + 1;
  const fishList = (filter && per[filter] ? [[filter, per[filter].fit], ...fits.filter(x => x[0] !== filter)] : fits).slice(0, 4);
  return `<div class="sh-head"><div class="num">${rank || ''}</div><h2>${s.title}</h2><span class="conf ${conf}">${conf === 'good' ? 'Good chance' : 'Fair chance'}</span><button class="x" aria-label="Close" onclick="window.__close()">×</button></div>

  <div class="facts">

    ${tTop != null ? `<div class="fact"><i>Water</i><b>${tTop}°F on top</b><small>about ${d.t_deep ?? tTop}°F at ${zMid} ft</small></div>` : ''}
    <div class="fact wide"><i>Best time</i><b>${bt.main}</b>${bt.sub ? `<small>${bt.sub}</small>` : ''}</div>

}
function upsellHTML() {

    <button class="opt" data-buy="video"><span class="ic"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></span><span><b>Watch a short video</b><span>This lake free for 24 h</span></span><span class="pr">Free</span></button>
    <button class="opt" data-buy="lake"><span class="ic">◎</span><span><b>Lake Pass</b><span>${M.name}, all year</span></span><span class="pr">$4.99/yr</span></button>
    <button class="opt best" data-buy="all"><span class="tag">BEST VALUE</span><span class="ic">★</span><span><b>All Lakes</b><span>Every lake in the app</span></span><span class="pr">$19.99/yr</span></button>
  </div>`;
}
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 2200); }
function openSheet(j) {
  active = j;
  if (isLocked(j)) {
    sheet.innerHTML = `<button class="x" style="position:absolute;right:12px;top:10px;z-index:2" aria-label="Close" onclick="window.__close()">×</button><div class="lockwrap"><div class="blurred" aria-hidden="true">${spotHTML(j)}</div>${upsellHTML()}</div>`;
    sheet.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
      if (window.ReactNativeWebView) post({ buy: b.dataset.buy, lake: LID, spot: j });
      else toast('Unlock in the LakeScope app');
    });
  } else sheet.innerHTML = spotHTML(j);
  sheet.scrollTop = 0;
  sheet.classList.add('show'); document.body.classList.add('sheet-open'); pins.forEach((p, q) => p.el.classList.toggle('on', q === j)); dirty = true;
  requestAnimationFrame(() => bringIntoView(j));
}
function bringIntoView(j) {
  const w = innerWidth, h = innerHeight, sr = sheet.getBoundingClientRect(), cb = document.getElementById('card').getBoundingClientRect().bottom;
  const wide = w >= 900, p = pins[j].top.clone().setY(0).project(camera);
  const px = (p.x + 1) / 2 * w, py = (1 - p.y) / 2 * h;
  const freeR = wide ? sr.left - 20 : w, freeB = wide ? h : h - sheet.offsetHeight - 44;
  if (px > 20 && px < freeR - 20 && py > cb + 40 && py < freeB) return;
  const tx = wide ? Math.min(Math.max(px, 40), freeR - 60) : w / 2, ty = (cb + freeB) / 2;
  const ray = new THREE.Raycaster(), pl = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const hitAt = (x, y) => { ray.setFromCamera(new THREE.Vector2(x / w * 2 - 1, 1 - y / h * 2), camera); const v = new THREE.Vector3(); return ray.ray.intersectPlane(pl, v) ? v : null; };
  const a = hitAt(px, py), b = hitAt(tx, ty); if (!a || !b) return;
  const d = a.sub(b), t0 = performance.now(), c0 = camera.position.clone(), g0 = controls.target.clone();
  (function step() {
    const k = Math.min(1, (performance.now() - t0) / 450), e = 1 - Math.pow(1 - k, 3);
    camera.position.copy(c0).addScaledVector(d, e); controls.target.copy(g0).addScaledVector(d, e); controls.update(); dirty = true;
    if (k < 1) requestAnimationFrame(step);
  })();
}
function closeSheet() { sheet.classList.remove('show'); document.body.classList.remove('sheet-open'); active = -1; pins.forEach(p => p.el.classList.remove('on')); }
window.__close = closeSheet;
document.getElementById('planBtn').onclick = () => openSheet(order.find(o => isLocked(o.j))?.j ?? 0);
refreshPins();

// ---------- controls + fitted start view ----------
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.38; controls.minDistance = 1.5; controls.maxDistance = 80;
controls.screenSpacePanning = false; controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.9;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

// wet-cell sample for fitting + principal axis
const samp = []; for (let i = 0; i < N; i += 7) if (wet[i]) samp.push(new THREE.Vector3(pos[i * 3], 0, pos[i * 3 + 2]));
let mx = 0, mz = 0; samp.forEach(v => { mx += v.x; mz += v.z; }); mx /= samp.length; mz /= samp.length;
let sxx = 0, szz = 0, sxz = 0; samp.forEach(v => { const a = v.x - mx, b = v.z - mz; sxx += a * a; szz += b * b; sxz += a * b; });
const axis = 0.5 * Math.atan2(2 * sxz, sxx - szz);   // angle of long axis in XZ (from +X toward +Z)

function frameFit() {
  const w = innerWidth, h = innerHeight; camera.aspect = w / h; camera.updateProjectionMatrix();
  const portrait = h > w * 1.05;
  const tilt = portrait ? 0.74 : 0.86;  // polar angle from vertical
  // portrait: lake's long axis runs up the screen; landscape: across. Keep north roughly up.
  let az = portrait ? Math.PI / 2 - axis : -axis;
  if (Math.cos(az) < 0) az += Math.PI;
  const cardB = document.getElementById('card').getBoundingClientRect().bottom;
  const topN = 1 - 2 * (cardB + 16) / h, botN = portrait ? -1 + 2 * 92 / h : -0.84;
  const leftN = -0.92, rightN = 0.92;
  const target = new THREE.Vector3(mx, 0, mz);
  const dir = new THREE.Vector3(Math.sin(tilt) * Math.sin(az), Math.cos(tilt), Math.sin(tilt) * Math.cos(az));
  const tmp = new THREE.Vector3(), ray = new THREE.Raycaster(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const place = d => { camera.position.copy(target).addScaledVector(dir, d); camera.lookAt(target); camera.updateMatrixWorld(); };
  const box = () => { let x0 = 9, x1 = -9, y0 = 9, y1 = -9; for (const v of samp) { tmp.copy(v).project(camera); x0 = Math.min(x0, tmp.x); x1 = Math.max(x1, tmp.x); y0 = Math.min(y0, tmp.y); y1 = Math.max(y1, tmp.y); } return [x0, x1, y0, y1]; };
  const hit = (x, y) => { ray.setFromCamera(new THREE.Vector2(x, y), camera); const p = new THREE.Vector3(); return ray.ray.intersectPlane(plane, p) ? p : null; };
  let dist = 30;
  for (let it = 0; it < 5; it++) {
    let lo = 1, hi = 150;
    for (let b = 0; b < 24; b++) {
      dist = (lo + hi) / 2; place(dist); const [x0, x1, y0, y1] = box();
      if (x1 - x0 > rightN - leftN || y1 - y0 > topN - botN) lo = dist; else hi = dist;
    }
    dist = hi; place(dist); const [x0, x1, y0, y1] = box();
    const pa = hit((x0 + x1) / 2, (y0 + y1) / 2), pb = hit((leftN + rightN) / 2, (topN + botN) / 2);
    if (pa && pb) target.add(pa.sub(pb));

}
dirty = true;
function resize() { renderer.setSize(innerWidth, innerHeight, false); }
resize(); frameFit();
addEventListener('resize', () => { resize(); frameFit(); });
document.getElementById('bReset').onclick = frameFit;
document.getElementById('bNorth').onclick = () => {
  const off = camera.position.clone().sub(controls.target), r = Math.hypot(off.x, off.z);
  camera.position.set(controls.target.x, camera.position.y, controls.target.z + r); controls.update(); dirty = true;
};
document.getElementById('bWater').onclick = () => { water.visible = !water.visible; document.getElementById('bWater').classList.toggle('on', !water.visible); dirty = true; };
let tempMode = false;
document.getElementById('bTemp').onclick = () => {
  tempMode = !tempMode; water.material = waterMats[tempMode ? 1 : 0]; water.visible = true; contourGroup.visible = !tempMode;
  document.getElementById('bTemp').classList.toggle('on', tempMode);
  const [a, b] = M.tempRange;
  document.getElementById('lgT').textContent = tempMode ? `Water on top · ${when(C.tempDays)}` : 'Depth today';
  document.getElementById('lgB').classList.toggle('temp', tempMode);
  document.getElementById('lgK').innerHTML = tempMode ? `<span>${a}°F cooler</span><span>warmer ${b}°F</span>` : '<span>0</span><span>50</span><span>100</span><span>150</span><span>200 ft</span>';
  dirty = true;
};
if (QS.get('temp') === '1') document.getElementById('bTemp').click();
controls.addEventListener('change', () => { dirty = true; const h = document.getElementById('hint'); h.style.opacity = 0; });
setTimeout(() => document.getElementById('hint').style.opacity = 0, 5000);
document.getElementById('loading').remove();

const pv = new THREE.Vector3();
const needle = document.getElementById('needle');
function placePins() {
  const az = Math.atan2(camera.position.x - controls.target.x, camera.position.z - controls.target.z);
  needle.style.transformOrigin = "50% 50%"; needle.style.transform = `rotate(${az * 180 / Math.PI}deg)`;
  const w = innerWidth, h = innerHeight;
  for (const p of pins) {
    pv.copy(p.top).project(camera);
    const vis = pv.z < 1 && Math.abs(pv.x) < 1.05 && Math.abs(pv.y) < 1.05;
    p.el.style.opacity = vis ? 1 : 0; p.el.style.pointerEvents = vis ? 'auto' : 'none';
    p.el.style.transform = `translate(${(pv.x + 1) / 2 * w}px,${(1 - pv.y) / 2 * h}px)`;
  }
}
function loop() {
  requestAnimationFrame(loop);
  const moved = controls.update();
  if (moved || dirty) { renderer.render(scene, camera); placePins(); dirty = false; }
}
loop();
window.__ready = true;
window.__dbg = { camera, controls, setDirty: () => { dirty = true; }, openSheet };
